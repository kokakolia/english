<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тёмная тема — главный экран (ПК)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
  * { box-sizing: border-box; }
  .dh-btn { border: none; cursor: pointer; font-family: 'Lora', serif; }
  .dh-btn:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<div id="stage" style="width: 1440px; height: 900px; position: absolute; top: 50%; left: 50%; overflow: hidden; background: #000000; font-family: 'Lora', serif; box-sizing: border-box; transform-origin: center center;">

  <svg viewBox="0 0 1440 900" width="1440" height="900" style="position: absolute; top: 0; left: 0;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="dh-glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="0.7"></feGaussianBlur>
      </filter>
      <filter id="dh-tendril" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="0.6"></feGaussianBlur>
      </filter>
      <filter id="dh-tip-glow" x="-150%" y="-150%" width="400%" height="400%">
        <feGaussianBlur stdDeviation="4"></feGaussianBlur>
      </filter>
      <radialGradient id="dh-vignette" cx="50%" cy="18%" r="78%">
        <stop offset="0%" stop-color="#0A1220"></stop>
        <stop offset="55%" stop-color="#020308"></stop>
        <stop offset="100%" stop-color="#000000"></stop>
      </radialGradient>
      <symbol id="dh-feather-kelp" viewBox="0 0 140 220">
        <path d="M20 214 C 30 170 15 130 35 90 C 50 60 25 30 45 0" fill="none" stroke="#4FA8FF" stroke-width="4" stroke-linecap="round"></path>
        <g fill="#4FA8FF">
          <path d="M20 214 C 8 204 4 190 8 178 C 20 184 24 200 20 214 Z"></path>
          <path d="M27 188 C 40 180 46 168 44 156 C 30 160 24 174 27 188 Z"></path>
          <path d="M18 162 C 4 156 -2 144 0 132 C 14 136 20 150 18 162 Z"></path>
          <path d="M32 138 C 46 132 52 120 50 108 C 36 111 30 126 32 138 Z"></path>
          <path d="M22 112 C 8 107 1 95 3 84 C 17 87 24 100 22 112 Z"></path>
          <path d="M36 86 C 49 80 54 69 52 58 C 39 61 33 74 36 86 Z"></path>
          <path d="M28 60 C 15 56 8 45 10 34 C 23 37 30 49 28 60 Z"></path>
          <path d="M40 34 C 52 28 56 18 54 8 C 42 11 37 23 40 34 Z"></path>
        </g>
      </symbol>
      <symbol id="dh-plankton" viewBox="-8 -8 16 16">
        <circle r="3.2" fill="#BFE6FF"></circle>
      </symbol>
    </defs>

    <rect x="0" y="0" width="1440" height="900" fill="url(#dh-vignette)"></rect>

    <g filter="url(#dh-glow)" opacity="0.85">
      <use href="#dh-feather-kelp" x="-40" y="580" width="210" height="360"></use>
      <use href="#dh-feather-kelp" x="90" y="560" width="150" height="360" transform="rotate(8 165 740)"></use>
      <g transform="translate(1440,0) scale(-1,1)">
        <use href="#dh-feather-kelp" x="-40" y="580" width="190" height="340"></use>
      </g>
    </g>
    <g filter="url(#dh-glow)" opacity="0.7">
      <use href="#dh-plankton" x="1370" y="180" width="12" height="12"></use>
      <use href="#dh-plankton" x="40" y="230" width="11" height="11"></use>
      <use href="#dh-plankton" x="1390" y="620" width="10" height="10"></use>
    </g>

    <g transform="translate(720,138)">
      <circle r="88" fill="none" stroke="#16233A" stroke-width="1" stroke-dasharray="1 7" opacity="0.6"></circle>
      <g filter="url(#dh-tendril)" stroke="#6EC9FF" stroke-width="1.8" fill="none" opacity="0.55">
        <path d="M0 0 C -20 -22 -16 -46 -32 -64"></path>
        <path d="M0 0 C 20 -22 16 -46 32 -64"></path>
        <path d="M0 0 C -26 10 -42 26 -48 48"></path>
        <path d="M0 0 C 26 10 42 26 48 48"></path>
        <path d="M0 0 C -6 26 -18 40 -14 60"></path>
        <path d="M0 0 C 6 26 18 40 14 60"></path>
      </g>
      <g filter="url(#dh-tip-glow)" fill="#BFE6FF" opacity="0.85">
        <circle cx="-32" cy="-64" r="2.8"></circle>
        <circle cx="32" cy="-64" r="2.8"></circle>
        <circle cx="-48" cy="48" r="2.6"></circle>
        <circle cx="48" cy="48" r="2.6"></circle>
        <circle cx="-14" cy="60" r="2.2"></circle>
        <circle cx="14" cy="60" r="2.2"></circle>
      </g>
      <circle r="32" fill="rgba(110,201,255,0.14)" filter="url(#dh-tip-glow)"></circle>
      <circle r="16" fill="#BFE6FF" filter="url(#dh-tip-glow)" opacity="0.85"></circle>
      <circle r="7.5" fill="#F2FAFF"></circle>
    </g>
  </svg>

  <div style="position: relative; z-index: 1; height: 100%; box-sizing: border-box; padding: 40px 56px; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-family: 'Marcellus', serif; font-size: 14px; letter-spacing: 0.14em; color: #4C7196; text-transform: uppercase;">Пятница, 12 сентября</div>
      <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="2.5" r="1.4" fill="#4C7196"></circle><circle cx="8" cy="8" r="1.4" fill="#4C7196"></circle><circle cx="8" cy="13.5" r="1.4" fill="#4C7196"></circle></svg>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 248px;">
      <div style="width: 620px;">

        <div style="text-align: center;">
          <div style="font-family: 'Marcellus', serif; font-size: 32px; color: #E7F3FC;">31 карточка</div>
          <div style="margin-top: 6px; font-size: 17px; color: #6D8AA3;">готовы к повторению сегодня</div>
        </div>

        <div style="display: flex; justify-content: center;">
          <button class="dh-btn" style="margin-top: 28px; padding: 17px 54px; border-radius: 999px; background: rgba(110,201,255,0.08); border: 1px solid #6EC9FF; box-shadow: 0 0 26px rgba(110,201,255,0.26); color: #D3EEFF; font-family: 'Marcellus', serif; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase;">Начать повторение</button>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-top: 36px;">
          <div style="flex: 1; height: 1px; background: linear-gradient(to right, transparent, #1E3450); opacity: 0.9;"></div>
          <div style="width: 6px; height: 6px; transform: rotate(45deg); background: #6EC9FF;"></div>
          <div style="flex: 1; height: 1px; background: linear-gradient(to left, transparent, #1E3450); opacity: 0.9;"></div>
        </div>

        <div style="display: flex; gap: 16px; margin-top: 28px;">
          <div style="flex: 1; background: rgba(110,201,255,0.05); border: 1px solid rgba(110,201,255,0.2); border-radius: 16px; padding: 20px 12px; text-align: center;">
            <div style="font-family: 'Marcellus', serif; font-size: 26px; color: #BFE6FF;">31</div>
            <div style="margin-top: 5px; font-size: 12px; letter-spacing: 0.03em; color: #4C7196; text-transform: uppercase;">На сегодня</div>
          </div>
          <div style="flex: 1; background: rgba(110,201,255,0.05); border: 1px solid rgba(110,201,255,0.2); border-radius: 16px; padding: 20px 12px; text-align: center;">
            <div style="font-family: 'Marcellus', serif; font-size: 26px; color: #BFE6FF;">12</div>
            <div style="margin-top: 5px; font-size: 12px; letter-spacing: 0.03em; color: #4C7196; text-transform: uppercase;">Дней подряд</div>
          </div>
          <div style="flex: 1; background: rgba(110,201,255,0.05); border: 1px solid rgba(110,201,255,0.2); border-radius: 16px; padding: 20px 12px; text-align: center;">
            <div style="font-family: 'Marcellus', serif; font-size: 26px; color: #BFE6FF;">184</div>
            <div style="margin-top: 5px; font-size: 12px; letter-spacing: 0.03em; color: #4C7196; text-transform: uppercase;">Выучено</div>
          </div>
        </div>

        <div style="margin-top: 30px; font-family: 'Marcellus', serif; font-size: 14px; letter-spacing: 0.12em; color: #4C7196; text-transform: uppercase;">Колоды</div>

        <div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between; background: rgba(110,201,255,0.05); border: 1px solid rgba(110,201,255,0.2); border-radius: 16px; padding: 18px 22px;">
          <div>
            <div style="font-family: 'Marcellus', serif; font-size: 17px; color: #E7F3FC;">Коллокации A2–B1</div>
            <div style="margin-top: 4px; font-size: 14px; color: #6D8AA3;">31 из 96 · сегодня</div>
          </div>
          <svg width="9" height="15" viewBox="0 0 8 13"><path d="M1 1 L7 6.5 L1 12" fill="none" stroke="#6EC9FF" stroke-width="1.4"></path></svg>
        </div>

        <div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between; background: rgba(110,201,255,0.03); border: 1px solid rgba(110,201,255,0.12); border-radius: 16px; padding: 18px 22px; opacity: 0.75;">
          <div>
            <div style="font-family: 'Marcellus', serif; font-size: 17px; color: #B9D6E8;">Коллокации B2–C1</div>
            <div style="margin-top: 4px; font-size: 14px; color: #4C7196;">не начато · 64 карточки</div>
          </div>
          <svg width="9" height="15" viewBox="0 0 8 13"><path d="M1 1 L7 6.5 L1 12" fill="none" stroke="#4C7196" stroke-width="1.4"></path></svg>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1440, window.innerHeight / 900) * 0.96;
    document.getElementById('stage').style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();
</script>
</body>
</html>
